<!DOCTYPE html>
<html lang="en"> <head>
    <meta charset="UTF-8">
    <title>Winkelwagen - SAMKO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">SAMKO</a>
        </div>
        <nav>
            <div class="navbar">
                <a href="index.html">Home</a>
                <a href="Shop.html">Shop</a>
                <a href="missievisie.html">Missie en Visie</a>
                <a href="contact.html">Contact</a>
                <a href="winkelwagen.html" class="cart-icon">
                    <img src="shopping-cart-wit.png" alt="Winkelwagen" width="25">
                </a>
            </div>
        </nav>
    </header>

    <main class="shop-container" style="background-color: #f9f9f9; min-height: 70vh; padding: 40px 5%;">
        <h2 style="color: #222; border-bottom: 2px solid #00ff66; padding-bottom: 10px;">Jouw Winkelkar</h2>

        <ul id="mijn-winkelmand-lijst" style="color: #333; font-size: 20px; margin: 30px 0; list-style: none; padding: 0; font-weight: bold;">
        </ul>

        <div style="display: flex; justify-content: flex-start; margin-top: 20px;">
            <div style="background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 300px; color: #333;">
                <p style="display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 15px;">
                    Totaal: <span id="totaal-bedrag" style="font-weight: bold; color: #222;">€0.00</span>
                </p>
                <button class="buy-btn" style="width: 100%; border-radius: 25px;">Veilig Afrekenen</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div>
            &copy;2026 SAMKO Padel Gear. Alle rechten voorbehouden.
        </div>
        <div class="footer-logos">
            <a href="https://www.instagram.com/samkopdl/">
                <img src="logo_insta.png" alt="Instagram" height="35" style="height: 35px !important; width: auto !important;">
            </a>
            <img src="artsen zonder grenzen.png" alt="Artsen zonder grenzen" height="35" style="height: 35px !important; width: auto !important;">
            <img src="Oxfam.png" alt="Oxfam" height="35" style="height: 35px !important; width: auto !important;">
            <img src="Logo_of_UNICEF_(cropped).png" alt="Unicef" height="35" style="height: 35px !important; width: auto !important;">
        </div>
    </footer>

    <div id="cookie-banner" style="display: none; background-color: #1a1a1a; padding: 15px; position: fixed; bottom: 0; width: 100%; border-top: 2px solid #00ff66; text-align: center; z-index: 9999;">
        <span style="color: white;">Deze website gebruikt cookies om jouw padel-ervaring te verbeteren.</span>
        <div style="display: inline-block; margin-left: 15px;">
            <button id="accept-cookies" style="background-color: #00ff66; color: black; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">Accepteren</button>
            <button id="reject-cookies" style="background-color: #ff3333; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 10px;">Weigeren</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
